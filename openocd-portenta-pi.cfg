# openocd-portenta-pi.cfg
# CM5 / Raspberry Pi 5 + Portenta H7 over SWD

adapter driver linuxgpiod
transport select swd

# gpiochip4 is the RP1-controlled 40-pin header GPIO block on Pi 5 / CM5
adapter gpio swclk -chip 4 25
adapter gpio swdio -chip 4 24
adapter gpio srst  -chip 4 18

# Connect-under-reset
reset_config srst_only srst_push_pull connect_assert_srst

source [find target/stm32h7x.cfg]

init
reset halt